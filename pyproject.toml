[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminus-windows-agent"
version = "0.1.0"
description = "A local, one-shot Windows operator powered by a bounded ReAct loop and a small Gemma model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "pydantic>=2.8,<3",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
slm = "terminus_agent.cli:main"
terminus-ssh = "terminus_agent.remote_executor:main"
terminus-agent-host = "terminus_agent.remote_host:main"

[tool.setuptools]
packages = [
    "terminus_agent",
    "terminus_agent.data",
    "terminus_agent.tools",
]
package-dir = {terminus_agent = "src"}
include-package-data = true

[tool.setuptools.package-data]
"terminus_agent.data" = ["*.jsonl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
